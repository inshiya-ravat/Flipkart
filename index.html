<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flipkart</title>
    <link rel="stylesheet" href="main.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header>
      <div class="header-search">
        <button aria-label="flipkart logo" title="Flipkart">
          <img src="./assets/logo.svg" class="logo" alt="Flipkart logo" />
        </button>
        <div
          tabindex="0"
          title="Search for products, brads and more"
          aria-label="search for products, branch and more"
          class="search-input"
        >
          <input
            type="search"
            placeholder="Search for products,brands, and more"
          />
          <div>
            <img src="./assets/search.svg" alt="search icon" />
          </div>
        </div>
      </div>
      <nav class="header-actions">
        <button
          title="Login"
          onclick="alert('Sucessfully logged in')"
          aria-label="Click this button to login"
        >
          Login
        </button>
        <div class="action-container" id="more">
          <a href="#" aria-label="more" title="More">More</a>
          <div>
            <img src="./assets/more.svg" alt="down arrow" />
          </div>
        </div>
        <div class="action-container">
          <div>
            <img src="./assets/cart.svg" alt="cart" />
          </div>
          <a href="#" aria-label="go to cart" title="cart">Cart</a>
        </div>
      </nav>
    </header>
    <main>
      <section class="categories">
        <a href="#">
          <div class="category">
            <img src="./assets/offer.svg" alt="offer" />
            <h4>Top Offers</h4>
          </div>
        </a>
        <a href="#">
          <div class="category">
            <img src="./assets/grocery.svg" alt="grocery" />
            <h4>Grocery</h4>
          </div>
        </a>
        <a href="#">
          <div class="category">
            <img src="./assets/mobile.svg" alt="mobiles" />
            <h4>Mobiles</h4>
          </div>
        </a>
        <a href="#">
          <div class="category">
            <img src="./assets/fashion.svg" alt="fashion" />
            <div>
              <h4>Fashion</h4>
              <img src="./assets/more_black.svg" alt="more" />
            </div>
          </div>
        </a>
        <a href="#">
          <div class="category">
            <img src="./assets/electronics.svg" alt="electronics" />
            <div>
              <h4>Electronics</h4>
              <img src="./assets/more_black.svg" alt="more" />
            </div>
          </div>
        </a>
        <a href="#">
          <div class="category">
            <img src="./assets/home.svg" alt="home" />
            <div>
              <h4>Home</h4>
              <img src="./assets/more_black.svg" alt="more" />
            </div>
          </div>
        </a>
        <a href="#">
          <div class="category">
            <img src="./assets/appliances.svg" alt="Appliances" />
            <div>
              <h4>Appliances</h4>
              <img src="./assets/more_black.svg" alt="more" />
            </div>
          </div>
        </a>
        <a href="#">
          <div class="category">
            <img src="./assets/travel.svg" alt="travel" />
            <h4>Travel</h4>
          </div>
        </a>
        <a href="#">
          <div class="category">
            <img src="./assets/toys.svg" alt="Beauty, Toys and more" />
            <div>
              <h4>Beauty, Toys & More</h4>
              <img src="./assets/more_black.svg" alt="more" />
            </div>
          </div>
        </a>
      </section>
      <section>
        <div class="deals">
          <div class="deals-header">
            <div>
              <h5>Deals of the Day</h5>
              <img src="./assets/timer.svg" alt="timer">
              <p>22 : 07 : 36 Left</p>
            </div>
            <div>
              <button title="View All" aria-label="click to view all the deals of the day offers">
                VIEW ALL
              </button>
            </div>
          </div>
          <div>

          </div>
        </div>
        <div></div>
      </section>
      <section></section>
    </main>
  </body>
</html>
