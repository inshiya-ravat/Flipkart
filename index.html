<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flipkart</title>
    <link rel="stylesheet" href="main.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header>
      <div class="header-search">
        <button aria-label="flipkart logo" title="Flipkart">
          <img src="./assets/logo.svg" class="logo" alt="Flipkart logo">
        </button>
        <div
            tabindex="0"
          title="Search for products, brads and more"
          aria-label="search for products, branch and more"
          class="search-input"
        >
          <input
            type="search"
            placeholder="Search for products,brands, and more"
          />
          <div>
            <img src="./assets/search.svg" alt="search icon">
          </div>
        </div>
      </div>
      <nav class="header-actions">
        <button
          title="Login"
          onclick="alert('Sucessfully logged in')"
          aria-label="Click this button to login"
        >
          Login
        </button>
        <div class="action-container" id="more">
          <a href="#" aria-label="more" title="More">More</a>
          <div>
            <img src="./assets/more.svg" alt="down arrow">
          </div>
        </div>
        <div class="action-container">
          <div>
            <img src="./assets/cart.svg" alt="cart">
          </div>
          <a href="#" aria-label="go to cart" title="cart">Cart</a>
        </div>
      </nav>
    </header>
    <section class="category"></section>
    <section>
      <div></div>
      <div></div>
    </section>
    <section></section>
  </body>
</html>
